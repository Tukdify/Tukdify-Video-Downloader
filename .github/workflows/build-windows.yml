name: Build Windows EXE

# Builds MediaForge.exe on a Windows runner (you develop on Linux; GitHub
# produces the .exe). Every build pulls the newest yt-dlp so releases never
# go stale, and a weekly schedule auto-publishes a fresh build with zero effort.
on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you trigger a build manually from the Actions tab
  schedule:
    - cron: "0 6 * * 1"     # every Monday 06:00 UTC -> always-fresh yt-dlp

permissions:
  contents: write           # needed to publish the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (newest yt-dlp)
        run: |
          python -m pip install --upgrade pip
          pip install -U yt-dlp customtkinter pyinstaller

      - name: Download ffmpeg + ffprobe
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extracted -Force
          $ffmpeg  = Get-ChildItem -Recurse -Filter ffmpeg.exe  ffmpeg_extracted | Select-Object -First 1
          $ffprobe = Get-ChildItem -Recurse -Filter ffprobe.exe ffmpeg_extracted | Select-Object -First 1
          Copy-Item $ffmpeg.FullName  -Destination ffmpeg.exe
          Copy-Item $ffprobe.FullName -Destination ffprobe.exe
          Write-Host "Bundled:" (Get-Item ffmpeg.exe).Length "bytes ffmpeg"

      - name: Build EXE
        shell: pwsh
        run: |
          $iconArg = @()
          if (Test-Path "assets/icon.ico") { $iconArg = @("--icon", "assets/icon.ico") }
          pyinstaller --noconfirm --onefile --windowed `
            --name MediaForge `
            --collect-all customtkinter `
            --add-binary "ffmpeg.exe;." `
            --add-binary "ffprobe.exe;." `
            @iconArg `
            main.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaForge-windows
          path: dist/MediaForge.exe

      # Publish to a stable "latest" release so friends always get the fresh build.
      - name: Publish latest release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MediaForge (latest build)
          body: |
            Automated Windows build of MediaForge.
            yt-dlp was updated to the newest version at build time, so site
            support is current as of this build's date.

            **Download:** `MediaForge.exe` below — no install needed, just run it.
          files: dist/MediaForge.exe
