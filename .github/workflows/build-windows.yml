name: Build Windows EXE

# Builds Tukdify-Video-Downloader.exe on a Windows runner.
# Dependency versions (yt-dlp, ffmpeg) are pinned for reproducible builds.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download ffmpeg + ffprobe (pinned 7.1)
        shell: pwsh
        run: |
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extracted -Force
          $ffmpeg  = Get-ChildItem -Recurse -Filter ffmpeg.exe  ffmpeg_extracted | Select-Object -First 1
          $ffprobe = Get-ChildItem -Recurse -Filter ffprobe.exe ffmpeg_extracted | Select-Object -First 1
          Copy-Item $ffmpeg.FullName  -Destination ffmpeg.exe
          Copy-Item $ffprobe.FullName -Destination ffprobe.exe
          Write-Host "Bundled:" (Get-Item ffmpeg.exe).Length "bytes ffmpeg"

      - name: Build EXE
        shell: pwsh
        run: |
          $iconArg = @()
          if (Test-Path "assets/icon.ico") { $iconArg = @("--icon", "assets/icon.ico") }
          pyinstaller --noconfirm --onefile --windowed `
            --name Tukdify-Video-Downloader `
            --version-file version_info.txt `
            --collect-all customtkinter `
            --add-data "assets;assets" `
            --add-binary "ffmpeg.exe;." `
            --add-binary "ffprobe.exe;." `
            @iconArg `
            main.py

      - name: Smoke-test the built EXE (does it launch?)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/Tukdify-Video-Downloader.exe" -ArgumentList "--selftest" -PassThru -Wait
          if ($p.ExitCode -ne 0) {
            Write-Error "Tukdify-Video-Downloader.exe self-test failed (exit code $($p.ExitCode))"
            exit 1
          }
          Write-Host "EXE launched and self-test passed."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tukdify-Video-Downloader-windows
          path: dist/Tukdify-Video-Downloader.exe

      - name: Publish latest release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Tukdify Video Downloader v2.0.0
          body: |
            Automated Windows release of **Tukdify Video Downloader v2.0.0**.
            Universal 4K & MP3 Media Ingestion for the Tukdify Ecosystem.

            • **Portable Executable:** Download `Tukdify-Video-Downloader.exe` below — no installer or admin rights required.
            • **Bundled FFmpeg:** Pre-packaged with FFmpeg 7.1 essentials.
          files: dist/Tukdify-Video-Downloader.exe
