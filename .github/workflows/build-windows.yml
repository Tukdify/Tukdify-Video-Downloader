name: Build Windows EXE

# Builds MediaForge.exe on a Windows runner (you develop on Linux; GitHub
# produces the .exe). Dependency versions (yt-dlp, ffmpeg) are pinned for
# reproducible builds — bump them deliberately, then push to rebuild.
on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you trigger a build manually from the Actions tab

permissions:
  contents: write           # needed to publish the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download ffmpeg + ffprobe (pinned 7.1)
        shell: pwsh
        run: |
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extracted -Force
          $ffmpeg  = Get-ChildItem -Recurse -Filter ffmpeg.exe  ffmpeg_extracted | Select-Object -First 1
          $ffprobe = Get-ChildItem -Recurse -Filter ffprobe.exe ffmpeg_extracted | Select-Object -First 1
          Copy-Item $ffmpeg.FullName  -Destination ffmpeg.exe
          Copy-Item $ffprobe.FullName -Destination ffprobe.exe
          Write-Host "Bundled:" (Get-Item ffmpeg.exe).Length "bytes ffmpeg"

      - name: Build EXE
        shell: pwsh
        run: |
          $iconArg = @()
          if (Test-Path "assets/icon.ico") { $iconArg = @("--icon", "assets/icon.ico") }
          pyinstaller --noconfirm --onefile --windowed `
            --name MediaForge `
            --version-file version_info.txt `
            --collect-all customtkinter `
            --add-data "assets;assets" `
            --add-binary "ffmpeg.exe;." `
            --add-binary "ffprobe.exe;." `
            @iconArg `
            main.py

      - name: Smoke-test the built EXE (does it launch?)
        shell: pwsh
        run: |
          # Runs the packaged app in --selftest mode: it builds the full window,
          # renders every page, then exits 0. Proves the .exe actually launches
          # with all dependencies + ffmpeg bundled correctly.
          $p = Start-Process -FilePath "dist/MediaForge.exe" -ArgumentList "--selftest" -PassThru -Wait
          if ($p.ExitCode -ne 0) {
            Write-Error "MediaForge.exe self-test failed (exit code $($p.ExitCode))"
            exit 1
          }
          Write-Host "EXE launched and self-test passed."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaForge-windows
          path: dist/MediaForge.exe

      # Publish to a stable "latest" release so friends always get the fresh build.
      - name: Publish latest release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MediaForge (latest build)
          body: |
            Automated Windows build of MediaForge.
            yt-dlp was updated to the newest version at build time, so site
            support is current as of this build's date.

            **Download:** `MediaForge.exe` below — no install needed, just run it.
          files: dist/MediaForge.exe
